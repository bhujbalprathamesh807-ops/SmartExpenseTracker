[project]
name = "smart-expense-tracker"
version = "1.0.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "Django==6.0.8",
    "Pillow==11.3.0",
    "dj-database-url==2.3.0",
    "whitenoise==6.9.0",
    "psycopg[binary]>=3.1.12,<4",
]

[tool.vercel.scripts]
build = 'if [ -n "$DATABASE_URL" ]; then python manage.py migrate --noinput; fi'
